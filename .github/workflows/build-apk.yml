name: Generar APK

on:
  push:
    branches: [ main, clean-session-analyzer-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Generar APK de prueba
        run: gradle assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BetanoCompanion-2.0-clean-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

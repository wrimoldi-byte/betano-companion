plugins { id 'com.android.application' }

android {
    namespace 'com.walter.betanocompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.walter.betanocompanion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.1-clean-gpt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
